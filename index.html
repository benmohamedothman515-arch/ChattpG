
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d18">

<title>ChattpG - Your AI Assistant</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #080d18;
  color: #ffffff;
  min-height: 100vh;
}

.app {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 260px;
  background: #0d1525;
  padding: 25px 18px;
  border-right: 1px solid #202b40;
  display: flex;
  flex-direction: column;
}

.logo {
  font-size: 27px;
  font-weight: bold;
  color: #55b8ff;
  margin-bottom: 35px;
}

.logo span {
  color: #ffffff;
}

.new-chat {
  background: #14243b;
  color: white;
  border: 1px solid #294361;
  padding: 14px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 15px;
  margin-bottom: 25px;
}

.new-chat:hover {
  background: #1b3656;
}

.sidebar-info {
  color: #8292a9;
  font-size: 13px;
  line-height: 1.8;
  margin-top: auto;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 100vh;
}

.header {
  height: 70px;
  border-bottom: 1px solid #202b40;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 25px;
}

.header-title {
  font-size: 17px;
  font-weight: bold;
}

.status {
  color: #43d69a;
  font-size: 13px;
}

.chat {
  flex: 1;
  width: 100%;
  max-width: 900px;
  margin: auto;
  padding: 35px 25px 20px;
  overflow-y: auto;
  min-height: 300px;
}

.welcome {
  text-align: center;
  margin: 65px auto 40px;
}

.welcome-icon {
  width: 75px;
  height: 75px;
  border-radius: 22px;
  background: linear-gradient(135deg,#1689ec,#7658ed);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 25px;
  font-size: 35px;
}

.welcome h1 {
  font-size: 32px;
  margin-bottom: 15px;
}

.welcome p {
  color: #9aabc2;
  line-height: 1.7;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 12px;
  margin-top: 35px;
}

.suggestion {
  background: #101b2d;
  border: 1px solid #263750;
  padding: 17px;
  border-radius: 13px;
  color: #dbe8f7;
  text-align: left;
  cursor: pointer;
  line-height: 1.5;
}

.suggestion:hover {
  border-color: #399fff;
  background: #14243b;
}

.message {
  display: flex;
  gap: 12px;
  margin-bottom: 25px;
  align-items: flex-start;
}

.avatar {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  border-radius: 11px;
  background: #19395d;
  display: flex;
  align-items: center;
  justify-content: center;
}

.message-content {
  background: #111d30;
  padding: 15px 18px;
  border-radius: 12px;
  max-width: 85%;
  line-height: 1.8;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user-message {
  justify-content: flex-end;
}

.user-message .message-content {
  background: #164c80;
}

.user-message .avatar {
  display: none;
}

.composer-area {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 15px 25px 25px;
}

.composer {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: #111d30;
  border: 1px solid #344963;
  border-radius: 16px;
  padding: 12px;
}

.composer textarea {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  resize: none;
  min-height: 30px;
  max-height: 150px;
  font-size: 16px;
  padding: 8px;
  font-family: inherit;
}

.composer textarea::placeholder {
  color: #8292a9;
}

.send {
  width: 43px;
  height: 43px;
  background: #1689ec;
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 22px;
  cursor: pointer;
}

.send:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.send:hover {
  background: #0874d1;
}

.footer {
  text-align: center;
  color: #708198;
  font-size: 11px;
  margin-top: 12px;
}

.typing {
  color: #8dbef0;
  padding: 12px;
}

@media(max-width:700px) {
  .sidebar {
    display: none;
  }

  .header {
    padding: 0 16px;
  }

  .chat {
    padding: 20px 15px;
  }

  .welcome {
    margin-top: 45px;
  }

  .welcome h1 {
    font-size: 25px;
  }

  .suggestions {
    grid-template-columns: 1fr;
  }

  .composer-area {
    padding: 10px 12px 18px;
  }

  .message-content {
    max-width: 90%;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="logo">Chattp<span>G</span></div>

    <button class="new-chat" onclick="newChat()">
      + New Chat
    </button>

    <div class="sidebar-info">
      ChattpG AI<br>
      Your intelligent assistant<br><br>
      © 2026 ChattpG
    </div>
  </aside>

  <main class="main">

    <header class="header">
      <div class="header-title">ChattpG AI</div>
      <div class="status">● AI Assistant</div>
    </header>

    <section class="chat" id="chat">

      <div class="welcome" id="welcome">

        <div class="welcome-icon">✦</div>

        <h1>Welcome to ChattpG</h1>

        <p>
          Your intelligent assistant for ideas,
          knowledge and creativity.
          <br>
          Ask anything. Discover everything.
        </p>

        <div class="suggestions">

          <button class="suggestion"
            onclick="useSuggestion('Explain artificial intelligence')">
            ✨ Explain artificial intelligence
          </button>

          <button class="suggestion"
            onclick="useSuggestion('Help me create a business')">
            💡 Help me create a business
          </button>

          <button class="suggestion"
            onclick="useSuggestion('Teach me something new')">
            📚 Teach me something new
          </button>

          <button class="suggestion"
            onclick="useSuggestion('Write a professional email')">
            ✍️ Write a professional email
          </button>

        </div>
      </div>

    </section>

    <div class="composer-area">

      <form class="composer" id="chatForm">

        <textarea
          id="messageInput"
          placeholder="Message ChattpG..."
          rows="1"
          required
        ></textarea>

        <button class="send" id="sendButton" type="submit">
          ↑
        </button>

      </form>

      <div class="footer">
        ChattpG AI can make mistakes. Verify important information.
      </div>

    </div>

  </main>

</div>

<script>

// Cloudflare Worker address
const API_URL =
"https://chattpg-ai.benmohamedothman515.workers.dev";

// Application state
let history = [];
let busy = false;

const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const input = document.getElementById("messageInput");
const form = document.getElementById("chatForm");
const sendButton = document.getElementById("sendButton");

// Language detection
function detectLanguage(text) {

  if (/[\u0600-\u06FF]/.test(text)) {
    document.documentElement.lang = "ar";
    document.documentElement.dir = "rtl";
  } else {
    document.documentElement.lang = "en";
    document.documentElement.dir = "ltr";
  }

}

// Add a message to the chat
function addMessage(text, role) {

  if (welcome) {
    welcome.remove();
  }

  const message = document.createElement("div");
  message.className = "message " +
    (role === "user" ? "user-message" : "");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "👤" : "✦";

  const content = document.createElement("div");
  content.className = "message-content";

  // Safe text rendering
  content.textContent = text;

  message.appendChild(avatar);
  message.appendChild(content);

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}

// Loading indicator
function showTyping() {

  const typing = document.createElement("div");
  typing.id = "typing";
  typing.className = "typing";
  typing.textContent = "ChattpG is thinking...";

  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;

}

function hideTyping() {

  const typing = document.getElementById("typing");

  if (typing) {
    typing.remove();
  }

}

// Send message to AI
async function sendMessage(text) {

  if (busy || !text.trim()) return;

  busy = true;
  sendButton.disabled = true;

  detectLanguage(text);

  addMessage(text, "user");

  const previousHistory = history.slice(-10);

  input.value = "";
  input.style.height = "auto";

  showTyping();

  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text,
        history: previousHistory
      })

    });

    const data = await response.json();

    hideTyping();

    if (!response.ok) {
      throw new Error(
        data.details || data.error || "AI service error"
      );
    }

    if (!data.reply) {
      throw new Error("Empty AI response");
    }

    addMessage(data.reply, "assistant");

    history.push(
      { role: "user", content: text },
      { role: "assistant", content: data.reply }
    );

    history = history.slice(-20);

  } catch (error) {

    hideTyping();

    addMessage(
      "Connection error: " + error.message +
      "\nPlease check your internet connection and AI server.",
      "assistant"
    );

    console.error(error);

  } finally {

    busy = false;
    sendButton.disabled = false;
    input.focus();

  }

}

// Form submission
form.addEventListener("submit", function(event) {

  event.preventDefault();

  sendMessage(input.value.trim());

});

// Suggestions
function useSuggestion(text) {

  input.value = text;
  sendMessage(text);

}

// New conversation
function newChat() {

  history = [];

  chat.innerHTML = `
    <div class="welcome" id="welcome">
      <div class="welcome-icon">✦</div>
      <h1>Welcome to ChattpG</h1>
      <p>Your intelligent assistant for ideas, knowledge and creativity.</p>
      <div class="suggestions">
        <button class="suggestion" onclick="useSuggestion('Explain artificial intelligence')">
          ✨ Explain artificial intelligence
        </button>
        <button class="suggestion" onclick="useSuggestion('Help me create a business')">
          💡 Help me create a business
        </button>
        <button class="suggestion" onclick="useSuggestion('Teach me something new')">
          📚 Teach me something new
        </button>
        <button class="suggestion" onclick="useSuggestion('Write a professional email')">
          ✍️ Write a professional email
        </button>
      </div>
    </div>
  `;

}

// Textarea auto resize
input.addEventListener("input", function() {

  input.style.height = "auto";

  input.style.height =
    Math.min(input.scrollHeight, 150) + "px";

});

// Enter to send, Shift+Enter for new line
input.addEventListener("keydown", function(event) {

  if (event.key === "Enter" && !event.shiftKey) {

    event.preventDefault();
    form.requestSubmit();

  }

});

</script>

</body>
</html>
