
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="ChattpG - Your Global AI Assistant">
  <title>ChattpG | Global AI Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <header>
      <div class="logo">✦ ChattpG</div>
      <span class="status">● Online</span>
    </header>

    <section class="hero">
      <div class="eyebrow">YOUR GLOBAL AI ASSISTANT</div>

      <h1>مرحباً بك في <span>ChattpG</span></h1>

      <p>
        مساعدك الذكي العالمي.
        اسأل، اكتشف، تعلم وابدأ محادثة جديدة.
      </p>

      <div class="chat-box">
        <input
          id="userInput"
          type="text"
          placeholder="اكتب سؤالك هنا..."
          autocomplete="off"
        >
        <button id="sendButton">إرسال ←</button>
      </div>

      <div id="response" class="response">
        أهلاً بك! كيف يمكنني مساعدتك اليوم؟
      </div>
    </section>

    <footer>
      © 2026 ChattpG. All rights reserved.
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
